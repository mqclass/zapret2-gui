name: Release Build

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
      - dev
  workflow_dispatch:
    inputs:
      linux_smoke:
        description: 'Also run the live Linux engine smoke job'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build & Release Windows x86_64
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check version consistency
        shell: pwsh
        run: |
          $cargo = [regex]::Match((Get-Content src-tauri/Cargo.toml -Raw), '(?ms)\[package\].*?^version\s*=\s*"([^"]+)"').Groups[1].Value
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $tauri = (Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $i18n = @{}
          foreach ($lang in @('ru','en','uk')) {
            $i18n[$lang] = [regex]::Match((Get-Content "src/i18n/$lang.ts" -Raw), '(?m)^\s*version:\s*"v?([^"]+)"').Groups[1].Value
          }
          Write-Host "Versions: cargo=$cargo package=$pkg tauri=$tauri ru=$($i18n['ru']) en=$($i18n['en']) uk=$($i18n['uk'])"
          $all = @($cargo, $pkg, $tauri, $i18n['ru'], $i18n['en'], $i18n['uk'])
          if (($all | Select-Object -Unique).Count -ne 1) {
            Write-Error "Version mismatch across sources: cargo=$cargo package=$pkg tauri=$tauri ru=$($i18n['ru']) en=$($i18n['en']) uk=$($i18n['uk'])"
            exit 1
          }

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup runtime binaries
        shell: pwsh
        run: |
          powershell -ExecutionPolicy Bypass -File scripts/setup_binaries.ps1

      - name: Build Tauri supervisor release binary
        run: |
          cd src-tauri
          # Build zapret2-svc first: the main binary's build script bundles it
          # as a Tauri resource, so it must exist before tauri-build runs.
          cargo build --release --bin zapret2-svc
          cargo build --release

      - name: Compute package version
        shell: pwsh
        run: |
          # Branch names may contain '/' (e.g. feature/linux-port), which is
          # not valid inside a file or artifact name; tag names are unaffected.
          $ver = "${{ github.ref_name }}" -replace '[\\/]', '-'
          if (-not $ver) { $ver = "latest" }
          "PKG_VER=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Package Release
        shell: pwsh
        run: |
          $pkgDir = "./release-pkg"
          New-Item -ItemType Directory -Path $pkgDir -Force | Out-Null
          
          Copy-Item src-tauri/target/release/zapret2-supervisor.exe "$pkgDir/zapret2.exe" -Force
          Copy-Item src-tauri/target/release/zapret2-svc.exe "$pkgDir/zapret2-svc.exe" -Force
          Copy-Item -Path ./bin -Destination "$pkgDir/bin" -Recurse -Force
          Copy-Item -Path ./lists -Destination "$pkgDir/lists" -Recurse -Force
          if (Test-Path "strategies") { Copy-Item -Path ./strategies -Destination "$pkgDir/strategies" -Recurse -Force }
          if (Test-Path "configs") { Copy-Item -Path ./configs -Destination "$pkgDir/configs" -Recurse -Force }
          if (Test-Path "docs") { Copy-Item -Path ./docs -Destination "$pkgDir/docs" -Recurse -Force; Get-ChildItem "$pkgDir/docs" -Filter "BUGS_TO_FIX*" | Remove-Item -Force; Get-ChildItem "$pkgDir/docs" -Filter "BUG_HUNTER*" | Remove-Item -Force; Remove-Item "$pkgDir/docs/UI_REDESIGN_GUIDE.md" -Force -ErrorAction SilentlyContinue }
          
          # Root helper binaries
          if (Test-Path "bin/WinDivert.dll") { Copy-Item "bin/WinDivert.dll" "$pkgDir/" -Force }
          if (Test-Path "bin/WinDivert64.sys") { Copy-Item "bin/WinDivert64.sys" "$pkgDir/" -Force }
          if (Test-Path "bin/cygwin1.dll") { Copy-Item "bin/cygwin1.dll" "$pkgDir/" -Force }
          if (Test-Path "bin/winws2.exe") { Copy-Item "bin/winws2.exe" "$pkgDir/" -Force }
          
          Copy-Item -Path ./README.md -Destination "$pkgDir/" -Force
          Copy-Item -Path ./README_EN.md -Destination "$pkgDir/" -Force
          Copy-Item -Path ./CONFIG_GUIDE.md -Destination "$pkgDir/" -Force
          Copy-Item -Path ./LICENSE -Destination "$pkgDir/" -Force

          # Create launch bat
          "@echo off`r`ncd /d `"%~dp0`"`r`nstart `"`" `"zapret2.exe`"" | Set-Content -Path "$pkgDir/Запустить zapret2.bat" -Encoding ASCII

          $ver = "${{ env.PKG_VER }}"
          Compress-Archive -Path "$pkgDir/*" -DestinationPath "./zapret2-${ver}-windows-x64.zip" -CompressionLevel Optimal

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: zapret2-${{ env.PKG_VER }}-windows-x64
          path: ./zapret2-*-windows-x64.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: zapret2 ${{ github.ref_name }}
          files: |
            ./zapret2-*-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-check:
    name: Check & Test Linux x86_64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup runtime binaries
        run: ./scripts/setup_binaries.sh

      - name: Run tests
        run: cargo test --manifest-path src-tauri/Cargo.toml

      - name: Build binaries
        run: cargo build --manifest-path src-tauri/Cargo.toml

  linux-smoke:
    name: Live engine smoke on Linux
    if: github.event_name == 'workflow_dispatch' && inputs.linux_smoke
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev pkg-config nftables

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build

      - name: Setup runtime binaries
        run: ./scripts/setup_binaries.sh

      - name: Build binaries
        run: cargo build --manifest-path src-tauri/Cargo.toml --bins

      - name: Probe kernel queue support
        run: |
          echo "kernel: $(uname -r)"
          sudo modprobe nfnetlink_queue || echo "modprobe nfnetlink_queue failed (rc=$?)"
          ls -la /proc/net/nfnetlink_queue || echo "/proc/net/nfnetlink_queue absent (not decisive by itself)"
          nft --version
          # Decisive probe: a throwaway table with a real queue rule.
          sudo nft add table inet smokeprobe
          sudo nft add chain inet smokeprobe output '{ type filter hook output priority mangle; }'
          if sudo nft add rule inet smokeprobe output queue num 200 bypass; then
            echo "QUEUE-PROBE: OK (kernel accepted a queue rule)"
          else
            echo "QUEUE-PROBE: REJECTED (queue subsystem unavailable)"
          fi
          sudo nft delete table inet smokeprobe || true

      - name: Stage service next to bin and strategies
        run: |
          mkdir -p /tmp/stage /tmp/smoke
          cp src-tauri/target/debug/zapret2-svc /tmp/stage/
          cp -r bin strategies /tmp/stage/
          ls /tmp/stage/bin/nfqws2 && /tmp/stage/bin/nfqws2 --version || true

      - name: Start service
        run: |
          cd /tmp/stage
          sudo env ZAPRET2_SVC_SOCKET=/tmp/smoke/svc.sock ./zapret2-svc > /tmp/smoke/svc.log 2>&1 &
          for i in $(seq 1 30); do [ -S /tmp/smoke/svc.sock ] && break; sleep 1; done
          ls -la /tmp/smoke/svc.sock

      - name: Smoke start (engine must reach running, table must exist)
        run: |
          sudo python3 scripts/linux_smoke.py /tmp/smoke/svc.sock start
          echo "--- nfqws2 processes:"; pgrep -a nfqws2
          echo "--- nft tables:"; sudo nft list tables
          echo "--- zapret2 table:"; sudo nft list table inet zapret2

      - name: Smoke stop (table must be gone)
        run: |
          sudo python3 scripts/linux_smoke.py /tmp/smoke/svc.sock stop
          sleep 2
          echo "--- nft tables after stop:"; sudo nft list tables
          if sudo nft list table inet zapret2 2>/dev/null; then
            echo "SMOKE: table still present after stop — FAIL"; exit 1
          fi
          echo "SMOKE: table cleanup OK"

      - name: Service log
        if: always()
        run: |
          echo "--- svc log:"; cat /tmp/smoke/svc.log || true
          sudo pkill -f zapret2-svc || true
