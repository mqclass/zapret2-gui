[package]
name = "zapret2-supervisor"
version = "1.1.0"
description = "zapret2 Windows DPI Bypass Utility"
authors = ["zapret2-gui"]
edition = "2021"

[[bin]]
name = "zapret2-svc"
path = "src/bin/svc.rs"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
embed-resource = "2.5"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
parking_lot = "0.12"
thiserror = "1.0"
# rand: OsRng for the Telegram bridge secret. sha2/zip/hex: streaming
# download integrity + archive extraction for the auto-update pipeline
# (updater.rs). NOTE: sha2 is "0.10" — there is no sha2 1.x on crates.io.
sha2 = "0.10"
hex = "0.4"
zip = "2"
rand = "0.8"
# Native Telegram MTProto→WebSocket bridge (MIT). Embedded in-process —
# no downloaded executable, no sidecar. Pinned to a release tag.
tg-ws-proxy-rs = { path = "vendor/tg-ws-proxy" } # vendored v2.5.4, see vendor/tg-ws-proxy/VENDOR.md
clap = { version = "4", features = ["derive"] }
# Funnel the bridge library's tracing diagnostics into our log buffer.
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_Security",
    # L-3: DPAPI (CryptProtectData) for the MTProto secret at rest.
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
    # svc-split: CreateNamedPipeW + SDDL DACL for the IPC pipe.
    "Win32_System_Pipes",
    "Win32_Storage_FileSystem",
    "Win32_Security_Authorization",
]
