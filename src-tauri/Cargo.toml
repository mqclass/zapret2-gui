[package]
name = "zapret2-supervisor"
version = "1.1.0"
description = "zapret2 Windows DPI Bypass Utility"
authors = ["zapret2-gui"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }
embed-resource = "2.5"

[dependencies]
tauri = { version = "2.0", features = ["tray-icon", "image-png"] }
tauri-plugin-shell = "2.0"
tauri-plugin-opener = "2"
tauri-plugin-notification = "2"
tauri-plugin-dialog = "2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.38", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
parking_lot = "0.12"
thiserror = "1.0"
# tgproxy.rs needs rand (OsRng secret generation) and sha2 (download
# integrity). NOTE: sha2 is "0.10" — there is no sha2 1.x on crates.io.
sha2 = "0.10"
hex = "0.4"
zip = "2"
rand = "0.8"
[dependencies.windows]
version = "0.58"
features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_Security",
    # L-3: DPAPI (CryptProtectData) for the MTProto secret at rest.
    "Win32_Security_Cryptography",
    "Win32_UI_Shell",
    "Win32_System_Registry",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Services",
]
